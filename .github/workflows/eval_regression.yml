name: Benchmark Evaluation & Regression Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    name: Evaluate Benchmark against 20 CVE Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Execute Evaluation Harness
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DRY_RUN: "true"
        run: |
          python eval_harness.py --samples 5

      - name: Archive Evaluation Reports
        uses: actions/upload-artifact@v4
        with:
          name: precision-recall-report
          path: eval/reports/
